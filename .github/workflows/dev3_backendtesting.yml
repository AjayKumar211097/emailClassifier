name: Build & deploy Python Function App

on:
    push:
        branches:
            - dev3
    workflow_dispatch:

env:
    AZURE_FUNCTIONAPP_PACKAGE_PATH: "./backend"
    PYTHON_VERSION: "3.10"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read #This is required for actions/checkout

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install dependencies
              run: |
                  cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            # Optional: Add step to run tests here

            - name: Zip artifact for deployment
              run: zip release.zip ./* -r

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v4
              with:
                  name: python-app
                  path: |
                      release.zip
                      !venv/

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            id-token: write #This is required for requesting the JWT
            contents: read #This is required for actions/checkout

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v4
              with:
                  name: python-app

            - name: Unzip artifact for deployment
              run: unzip release.zip

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B971B1BD54C44A2AAD566761F66FF26 }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_79A4AB72C9D643E89366850A3706F857 }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9BA3A488BF8F4FB48A132B790E80A142 }}

            - name: "Deploy to Azure Functions"
              uses: Azure/functions-action@v1
              id: deploy-to-function
              with:
                  app-name: "BackendTesting"
                  slot-name: "Production"
                  package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

